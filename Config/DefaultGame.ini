[/Script/HollowPhysics.HollowCarrySettings]
; ADR-0015. A stricter server carry state binds a remote carrier after this grace (must exceed the round trip; pick-ups
; are predicted, so honest clients claim the slowdown before the server even sees the request).
ServerSlowdownGraceSeconds=0.25
; A predicted pick-up the server never confirms stops being claimed after this long.
PickupPredictionTimeoutSeconds=1.0
; ADR-0028, co-op carry: the server checks the client-authoritative carriers 4 times a second (Docs/Architecture/03
; sec. 3.5): ground speed at most 1.3 x the co-op carry speed, no capsule inside (2 cm tolerance) or through the world.
CoopSanityIntervalSeconds=0.25
CoopSpeedTolerance=1.3
CoopPenetrationTolerance=2.0
; A carrier that left stays client-authoritative until its moves show it knows, then 0.5 s more (its velocity, shaped
; by the tether until then, settles to the server's) and until its moves agree; at most 2 s after the leave (Bad: RTT 400 ms).
CoopAuthoritySettleSeconds=0.5
CoopAuthorityTimeoutSeconds=2.0

