; Protocol: Hollow scalability overrides (S4-05, ADR-0023). Two presets use two engine levels (UHollowGraphicsSettings):
;   High = level 2: the E9 target (RTX 3060 class, 1080p, TSR at full resolution).
;   Low  = level 1: Lumen Lite (Irradiance Field final gather, the engine's GI level 1), Steam Deck and weak GPUs.
; Only what differs from Engine/Config/BaseScalability.ini is listed; every value is checked by a capture
; (Build/Scripts/perf-capture-mac.sh, perf-e9-win64.ps1) and by Hollow.Game.Graphics.Presets.

[ShadowQuality@1]
; The engine turns volumetric fog off at level 1; the atmosphere needs it: a coarser grid instead (High: 16 px x 64).
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=24
r.VolumetricFog.GridSizeZ=48
r.VolumetricFog.HistoryMissSupersampleCount=2
