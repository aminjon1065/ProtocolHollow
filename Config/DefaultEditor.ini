[/Script/HollowEditor.HollowArtBudgetSettings]
; Art-pass budget (ADR-0027): checked on save (Data Validation warnings) and by Hollow.Editor.ArtBudget (fails --strict).
; A texture cooks at most this large (its source limited by MaxTextureSize and LODBias).
MaxTextureSize=2048
+ScannedPaths=/Game/Hollow
+ScannedPaths=/HollowSector_Docks
; Art-01 (ADR-0043): the second sector and the Fab packs migrated into the game.
+ScannedPaths=/HollowSector_Cathedral
+ScannedPaths=/Game/Fab
; Outliner folders of a room level that hold decoration: no collision, no navigation (structure goes to Geometry).
+DecorFolders=Dressing
+DecorFolders=Fixtures
; FAB-01 (ADR-0051): levels besides the room definitions' whose decoration is checked (the hub).
+DecorLevels=/Game/Hollow/Maps/L_Hub_Skiff.L_Hub_Skiff
