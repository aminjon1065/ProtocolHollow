; LOC-01 (ADR-0048): the Game localization target, English native, Russian translated.
; Run by Build/Scripts/localize-mac.sh (GatherText commandlet). The Russian lives only in Content/Localization/Game/ru/Game.po
; (UTF-8); the steps import it, gather the player texts again, compile Game.locres and export the PO with new entries empty.
; Not gathered: the editor module, tests, dev commands and editor-only data (validation messages, editor tooling).

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

; Texts in C++ (LOCTEXT / NSLOCTEXT)
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/
ExcludePathFilters=Source/HollowEditor/*
ExcludePathFilters=*/Tests/*
ExcludePathFilters=*/Dev/*
; editor-only texts outside WITH_EDITOR: room validation and an EQS node's title
ExcludePathFilters=Source/HollowPCG/Private/Rules/HollowRoomRules.cpp
ExcludePathFilters=Source/HollowAI/Private/EQS/HollowEnvQueryNodes.cpp
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

; Texts in data: the string tables, data assets, widgets and levels of the game and its sector plugins
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/Hollow/*
IncludePathFilters=Plugins/GameFeatures/*/Content/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; The translation in ru/Game.po into the archives
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true
LocalizedTextCollapseMode=IdenticalTextIdAndSource
POFormat=Unreal

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

; The archives back into ru/Game.po: new entries come in empty, gone ones leave
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=IdenticalTextIdAndSource
POFormat=Unreal
ShouldPersistCommentsOnExport=false
