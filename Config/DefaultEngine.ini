[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Hollow/Maps/L_Boot.L_Boot
EditorStartupMap=/Game/Hollow/Maps/L_Hub_Dev.L_Hub_Dev
GlobalDefaultGameMode=/Game/Hollow/Core/Framework/BP_GameMode_Hub.BP_GameMode_Hub_C
; Seamless travel hub <-> raid passes through this empty map (Docs/Architecture/02 sec. 2.9).
TransitionMap=/Game/Hollow/Maps/L_Transition.L_Transition

[/Script/Engine.Engine]
AssetManagerClassName=/Script/HollowCore.HollowAssetManager
; CommonUI input routing requires its viewport client (S2-06 UI builds on it).
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient

[/Script/Engine.RendererSettings]
; Lumen-only: procedural sectors cannot be light-baked (ADR-0003, ADR-0008). Fewer shader permutations too (ADR-0009).
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Win64 ships DX12 / SM6 only (ADR-0009): halves shader compilation and cook memory on the 16 GB build laptop.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon editor: Metal SM6 only (Nanite, Lumen, VSM).
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[SystemSettings]
; Push-model replication for all gameplay state (ADR-0002).
net.IsPushModelEnabled=1
; Hub -> raid uses seamless travel; PIE needs it enabled explicitly.
net.AllowPIESeamlessTravel=1

[/Script/NavigationSystem.RecastNavMesh]
; Sectors are assembled at runtime: base navmesh is built after assembly (ADR-0004).
RuntimeGeneration=Dynamic

[/Script/Engine.GameEngine]
; Steam Datagram Relay P2P (NAT traversal, host IP hidden); IpNetDriver when Steam is unavailable (ADR-0006).
; Editor/PIE uses its own EditorEngine drivers, so PIE stays on IpNetDriver + Null OSS.
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[OnlineSubsystem]
DefaultPlatformService=Steam
; Build compatibility = engine network version + ProjectVersion (ADR-0006); no override.
bUseBuildIdOverride=False
BuildIdOverride=0

[OnlineSubsystemSteam]
bEnabled=true
; Spacewar test AppID until the Steam Direct app exists.
SteamDevAppId=480
bUseSteamNetworking=true
bAllowP2PPacketRelay=true
; Listen hosts use client SteamNetworkingSockets (P2P); the game server API is only needed for dedicated servers.
bInitServerOnClient=false

[/Script/Engine.CollisionProfile]
; HollowCollision::Interaction (S1-06): interactables and walls block it, cosmetic debris will ignore it.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Interaction")
