[/Script/Engine.Engine]
AssetManagerClassName=/Script/HollowCore.HollowAssetManager

[/Script/Engine.RendererSettings]
; Lumen-only: procedural sectors cannot be light-baked (ADR-0003, ADR-0008). Fewer shader permutations too (ADR-0009).
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Win64 ships DX12 / SM6 only (ADR-0009): halves shader compilation and cook memory on the 16 GB build laptop.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon editor: Metal SM6 only (Nanite, Lumen, VSM).
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[SystemSettings]
; Push-model replication for all gameplay state (ADR-0002).
net.IsPushModelEnabled=1

[/Script/NavigationSystem.RecastNavMesh]
; Sectors are assembled at runtime: base navmesh is built after assembly (ADR-0004).
RuntimeGeneration=Dynamic
