[/Script/Engine.RendererSettings]
; Lumen-only: procedural sectors cannot be light-baked (ADR-0003, ADR-0008). Fewer shader permutations too (ADR-0009).
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
; Software Lumen on every machine (Block 3 sec. 3.9 budgets it); an RTX card would otherwise switch to hardware tracing.
r.Lumen.HardwareRayTracing=0

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Win64 ships DX12 / SM6 only (ADR-0009): halves shader compilation and cook memory on the 16 GB build laptop.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/MacTargetPlatform.MacTargetSettings]
; Apple Silicon editor: Metal SM6 only (Nanite, Lumen, VSM).
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[SystemSettings]
; Push-model replication for all gameplay state (ADR-0002).
net.IsPushModelEnabled=1
; Hub -> raid uses seamless travel; PIE needs it enabled explicitly.
net.AllowPIESeamlessTravel=1

[/Script/NavigationSystem.NavigationSystemV1]
; Two nav agents (ADR-0004): Standard (Whisperers, Echo-Stalker) and Heavy (Iron Pilgrim, the largest agent of the kit,
; UHollowLevelMetrics). Step height matches the CMC (MaxStepHeight 45).
; DefaultQueryExtent X/Y reach the navmesh from the middle of a doorway (S3-04): door NavCut half depth 40 + agent radius.
!SupportedAgents=ClearArray
+SupportedAgents=(Name="Standard",Color=(R=0,G=200,B=255,A=164),DefaultQueryExtent=(X=100.000000,Y=100.000000,Z=250.000000),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=45.000000,AgentHeight=220.000000,AgentStepHeight=45.000000,NavWalkingSearchHeightScale=0.500000,bCanCrouch=False,bCanJump=False,bCanWalk=True,bCanSwim=False,bCanFly=False)
+SupportedAgents=(Name="Heavy",Color=(R=255,G=120,B=0,A=164),DefaultQueryExtent=(X=150.000000,Y=150.000000,Z=300.000000),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=80.000000,AgentHeight=280.000000,AgentStepHeight=45.000000,NavWalkingSearchHeightScale=0.500000,bCanCrouch=False,bCanJump=False,bCanWalk=True,bCanSwim=False,bCanFly=False)

[/Script/NavigationSystem.RecastNavMesh]
; Sectors are assembled at runtime: base navmesh is built after assembly (ADR-0004).
RuntimeGeneration=Dynamic

[/Script/Engine.GameEngine]
; Steam Datagram Relay P2P (NAT traversal, host IP hidden); IpNetDriver when Steam is unavailable (ADR-0006).
