bInitServerOnClient=false

[/Script/Engine.CollisionProfile]
; HollowCollision::Interaction (S1-06): interactables and walls block it, cosmetic debris will ignore it.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Interaction")
; HollowCollision::Debris (S3-01, ADR-0002): cosmetic Chaos fragments. Default Block, so walls, floors and doors stop debris;
; the profile ignores pawns (players and enemies), physics bodies (cores, props) and every trace, physics only.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="HollowDebris")
+Profiles=(Name="HollowDebris",CollisionEnabled=PhysicsOnly,bCanModify=False,ObjectTypeName="HollowDebris",CustomResponses=((Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore)),HelpMessage="Cosmetic debris (HollowCollision::Debris): settles on the world, never touches pawns, physics bodies or traces.")
; HollowCollision::CarryableProfile (S3-02, ADR-0015): a free Aether core. A physics body that rests on the world, blocks
; pawns and is focusable on Interaction; the camera ignores it.
+Profiles=(Name="HollowCarryable",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="PhysicsBody",CustomResponses=((Channel="Camera",Response=ECR_Ignore)),HelpMessage="Free heavy carryable (HollowCollision::CarryableProfile): physics body, blocks the world and pawns, focusable.")
; HollowCollision::CarriedProfile: the same core while carried. Query only and ignores everything except world dynamic
; volumes (extraction zones overlap it): it never blocks its carrier, the world, traces or interaction.
+Profiles=(Name="HollowCarried",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="PhysicsBody",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="Interaction",Response=ECR_Ignore),(Channel="HollowDebris",Response=ECR_Ignore)),HelpMessage="Carried heavy carryable (HollowCollision::CarriedProfile): overlaps world dynamic volumes only.")
